# Iteration 1 deployment: the server plus PostgreSQL (spec §2).
services:
  app:
    build: .
    ports:
      - "${THE_INDEX_PORT:-8080}:8080"
    environment:
      THE_INDEX_DB_URL: jdbc:postgresql://postgres:5432/the_index
      THE_INDEX_DB_USER: the_index
      THE_INDEX_DB_PASSWORD: ${THE_INDEX_DB_PASSWORD:-the_index}
    volumes:
      - ${THE_INDEX_STORAGE:-./data/storage}:/data/storage
      - ${THE_INDEX_INBOX:-./data/inbox}:/data/inbox
      - ${THE_INDEX_CACHE:-./data/cache}:/data/cache
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: the_index
      POSTGRES_USER: the_index
      POSTGRES_PASSWORD: ${THE_INDEX_DB_PASSWORD:-the_index}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U the_index -d the_index"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:

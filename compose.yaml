# Iteration 1 deployment: the server plus PostgreSQL (spec §2).
services:
  app:
    build: .
    ports:
      - "${LIBRARY_PORT:-8080}:8080"
    environment:
      LIBRARY_DB_URL: jdbc:postgresql://postgres:5432/library
      LIBRARY_DB_USER: library
      LIBRARY_DB_PASSWORD: ${LIBRARY_DB_PASSWORD:-library}
    volumes:
      - ${LIBRARY_STORAGE:-./data/storage}:/data/storage
      - ${LIBRARY_INBOX:-./data/inbox}:/data/inbox
      - ${LIBRARY_CACHE:-./data/cache}:/data/cache
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: library
      POSTGRES_USER: library
      POSTGRES_PASSWORD: ${LIBRARY_DB_PASSWORD:-library}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library -d library"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
